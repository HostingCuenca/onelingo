# Compila OneLingo para iOS en una Mac de GitHub, la firma con la firma en la
# nube de Apple (clave de API de App Store Connect) y la sube a TestFlight.
# Solo se lanza a mano (Actions → iOS TestFlight → Run workflow, o
# `gh workflow run ios-testflight.yml --ref <rama>`). Guía: docs/IOS-MAC.md.
#
# Secretos del repo (los carga el dueño de la cuenta, nunca van en el código):
#   ASC_KEY_ID     ID de la clave de API (rol Admin)
#   ASC_ISSUER_ID  Issuer ID de App Store Connect
#   ASC_KEY_P8     contenido del archivo AuthKey_XXXX.p8
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: URL del backend
        default: https://onelingo.org/api
        required: true

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TEAM_ID: V82AC4GTUM
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Clave de API de App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::Faltan los secretos ASC_KEY_ID, ASC_ISSUER_ID o ASC_KEY_P8 (ver docs/IOS-MAC.md)"; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Número de compilación
        run: |
          base=$(sed -nE 's/^version: [^+]+\+([0-9]+).*/\1/p' pubspec.yaml)
          echo "BUILD_NUMBER=$((base * 100 + GITHUB_RUN_NUMBER % 100 + GITHUB_RUN_ATTEMPT - 1))" >> "$GITHUB_ENV"
          echo "VERSION=$(sed -nE 's/^version: ([^+]+).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"

      - name: Flutter (sin firmar)
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          flutter --version
          flutter pub get
          flutter build ios --release --no-codesign \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_URL="$API_URL"

      # Se archiva SIN firmar: con firma automática Xcode pide un perfil de
      # desarrollo, que exige un iPhone registrado en la cuenta. La firma de
      # distribución la pone el paso siguiente, en la nube de Apple.
      - name: Archivo de Xcode
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 80
          test "${PIPESTATUS[0]}" -eq 0

      - name: Firmar en la nube y subir a TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Subida $VERSION ($BUILD_NUMBER) a App Store Connect; aparece en TestFlight cuando Apple termine de procesarla." >> "$GITHUB_STEP_SUMMARY"

      - name: Borrar la clave
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
