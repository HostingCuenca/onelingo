<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tutores IA · OneLingo</title>
<style>
/* Diseño de OneLingo (theme.dart): crema, morado #4519BB, Nunito. */
@font-face{font-family:Nunito;src:url('../assets/assets/fonts/Nunito.ttf') format('truetype');font-weight:200 1000;font-display:swap}
:root{--morado:#4519BB;--morado-oscuro:#2E0F86;--morado-claro:#E6DEFF;--morado-suave:#F3F0FF;--texto:#1C1B1B;--gris:#79758A;--borde:#EBE8E6;--verde:#40A652;--verde-suave:#E0F4E3;--rojo:#E03349;--naranja:#F7941D;--fondo:#FCF9F8}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font:16px Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
button:disabled{opacity:.45;cursor:default}

/* Galería (solo fuera de la app) */
#selection{max-width:1000px;margin:auto;padding:20px}
#selection h1{font-weight:900;margin:6px 0}#selection p{color:var(--gris)}
#eyebrow{color:var(--morado)!important;font-weight:900;letter-spacing:.06em;font-size:13px}
#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tutor{position:relative;padding:0;overflow:hidden;text-align:left;background:#fff;border-radius:20px;border:1.5px solid var(--borde)}
.portrait{aspect-ratio:.82;background:var(--morado-claro)}.portrait img{width:100%;height:100%;object-fit:cover;object-position:top}
.tutor strong,.tutor small{display:block;padding:8px 12px 0}.tutor small{color:var(--gris);font-size:12px;padding-bottom:12px}
.recommended{position:absolute;top:9px;left:9px;background:var(--naranja);color:#fff;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}
body.embebido #selection{display:none}

/* Llamada (como las apps de referencia, 12-11): el tutor arriba en una tarjeta,
   la conversación en burbujas debajo y los controles abajo. */
.llamada{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--fondo);overflow:hidden}
.llamada[hidden]{display:none}
.columna{width:100%;max-width:560px;margin:0 auto;padding:0 16px}
#stage{position:relative;flex:none;height:clamp(210px,36vh,380px);width:100%;max-width:640px;margin:0 auto;border-radius:0 0 28px 28px;overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 90% at 50% 18%,#6A45E0 0%,var(--morado) 45%,var(--morado-oscuro) 100%);box-shadow:0 10px 28px #2e0f8633;transition:box-shadow .35s}
body.en-llamada #stage[data-phase=speaking]{box-shadow:0 0 0 3px var(--morado-claro) inset,0 10px 28px #2e0f8644}
body.en-llamada #stage[data-phase=listening]{box-shadow:0 0 0 calc(3px + var(--nivel,0) * 7px) var(--verde) inset,0 10px 28px #40a65233;transition:box-shadow .08s linear}
.sobre{position:absolute;z-index:3;display:grid;place-items:center;min-width:44px;height:44px;padding:0 12px;border-radius:999px;background:#ffffff2e;color:#fff;font-weight:900;font-size:15px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sobre:hover{background:#ffffff45}
#end{top:max(12px,env(safe-area-inset-top));left:12px;width:44px;padding:0;font-size:20px}
.reloj{top:max(12px,env(safe-area-inset-top));left:64px;gap:8px;display:flex;align-items:center;font-variant-numeric:tabular-nums;pointer-events:none}
.reloj::before{content:'';width:8px;height:8px;border-radius:50%;background:#ffffffaa}
.reloj[data-fase=speaking]::before{background:#fff;animation:latido 1s ease-in-out infinite}
.reloj[data-fase=listening]::before{background:#5FE07A;animation:latido 1s ease-in-out infinite}
.reloj[data-fase=ready]::before{background:#5FE07A}
.reloj[data-fase=thinking]::before,.reloj[data-fase=voice-loading]::before{background:var(--naranja);animation:latido 1.4s ease-in-out infinite}
#velocidad{top:max(12px,env(safe-area-inset-top));right:12px}
#explica{top:max(12px,env(safe-area-inset-top));right:64px;font-size:13px;gap:4px;display:flex}
#explica[hidden],.insignia[hidden]{display:none}
.quien{position:absolute;z-index:3;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;max-width:calc(100% - 24px)}
.quien strong{color:#fff;font-size:17px;font-weight:900;text-shadow:0 1px 6px #0006}
.tema{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:#ffffff2e;color:#fff;font-weight:800;font-size:13px;min-width:0;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tema span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insignia{position:absolute;z-index:3;right:12px;bottom:14px;padding:5px 10px;border-radius:999px;background:#ffffffe6;color:var(--morado-oscuro);font-size:12px;font-weight:900}
.solo-lector{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes latido{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
#stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.lumo2d{position:absolute;inset:4% 0 0;pointer-events:none;transform-origin:50% 75%;transition:transform .45s ease}
.lumo2d img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 50%}
.lumo2d img[hidden]{display:none}
.lumo2d.pensando{transform:rotate(-3deg)}
.cargando{position:absolute;inset:0;display:grid;place-content:center;color:#fff;font-weight:800}
.cargando[hidden]{display:none}

/* Conversación en burbujas */
.chat{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 0 8px}
.mensajes{display:flex;flex-direction:column;gap:12px}
.msg{display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:88%}
.msg.mine{align-self:flex-end;align-items:flex-end}
.bubble{padding:12px 15px;border-radius:20px 20px 20px 6px;background:#fff;border:1.5px solid var(--borde);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.42;font-size:17px}
.msg.mine .bubble{border-radius:20px 20px 6px 20px;background:var(--morado-claro);border-color:transparent;color:var(--morado-oscuro);font-weight:700}
.msg.vivo .bubble{opacity:.75}
body.vivo #stage[data-phase=listening] ~ .chat .msg.vivo .bubble::after{content:'';display:inline-block;width:2px;height:1em;margin-left:4px;background:currentColor;vertical-align:-2px;animation:cursor .9s steps(2,start) infinite}
.msg.aviso-tema{align-self:center;max-width:100%}.msg.aviso-tema .bubble{background:none;border:0;color:var(--gris);font-size:13px;padding:2px}
.burbuja-traduccion{display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--borde);color:var(--gris);font-size:15px;font-weight:600}
.burbuja-traduccion[hidden]{display:none}
.romanizacion{display:block;margin-top:4px;font-size:14px;color:var(--gris)}
.acciones{display:flex;gap:8px;padding-left:4px}
.accion{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--morado);box-shadow:0 2px 10px #4519bb1f}
.accion svg{width:19px;height:19px}
.accion[aria-pressed=true]{background:var(--morado);color:#fff}
.accion.discreta{color:var(--gris);box-shadow:none;background:none}
.ideas{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
.ideas[hidden],.aviso-ayuda[hidden]{display:none}
.ideas-titulo{width:100%;text-align:center;font-size:12px;font-weight:900;color:var(--gris);letter-spacing:.04em;text-transform:uppercase}
.idea{padding:8px 13px;border-radius:999px;background:#fff;border:1.5px solid var(--morado-claro);color:var(--morado);font-size:15px;font-weight:700}
.aviso-ayuda{margin:6px 0 0;color:var(--gris);font-size:15px;font-style:italic}
.correccion{align-self:flex-start;max-width:88%;background:#FFF4E5;border:1.5px solid #F7941D55;border-radius:16px;padding:10px 12px;display:grid;gap:4px}
.correccion-titulo{font-size:11px;font-weight:900;color:#B25E00;letter-spacing:.04em;text-transform:uppercase}
.correccion-fila{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}.correccion s{color:var(--rojo)}.correccion strong{color:#197D58}.correccion small{color:var(--gris);font-size:14px}.flecha{color:var(--gris)}
.resumen{border:2px solid var(--morado-claro);border-radius:18px;padding:12px 14px;background:#fff}.resumen h3{margin:0 0 6px;color:var(--morado)}.resumen h4{margin:10px 0 4px;font-size:14px}.resumen ul{margin:0;padding-left:18px;display:grid;gap:4px}.resumen li small{display:block;color:var(--gris)}.resumen s{color:var(--rojo)}.resumen strong{color:#197D58}.resumen .siguiente{margin:10px 0 0;padding:10px 12px;border-radius:14px;background:var(--verde-suave);color:#1F5A2B;font-weight:700}

/* Abajo: avisos, escribir, contestar y controles */
.abajo{flex:none;padding-top:6px;padding-bottom:calc(max(12px,env(safe-area-inset-bottom)) + 18px);background:linear-gradient(#fcf9f800,var(--fondo) 18px)}
.pista{margin:0;text-align:center;font-size:13px;color:var(--gris);font-weight:700;min-height:18px}
.aviso{margin:4px 0 0;text-align:center;font-size:14px;color:var(--rojo);font-weight:700}
.aviso:empty{display:none}
.aviso button{color:var(--morado);font-weight:900;text-decoration:underline;margin-left:6px}
body:not(.en-llamada) .pista{display:none}
.llamada-inicio{display:none;flex-direction:column;align-items:center;gap:10px;padding:8px 0 6px}
body.puede-llamar:not(.en-llamada) .llamada-inicio{display:flex}
.llama-texto{margin:0;font-weight:900;font-size:17px}
.llamar{display:flex;align-items:center;gap:10px;padding:15px 30px;border-radius:999px;background:var(--verde);color:#fff;font-size:18px;font-weight:900;box-shadow:0 8px 22px #40a65255}
.llamar:hover{background:#2F8F40}
.controles{display:none;align-items:flex-end;justify-content:space-between;padding:8px 18px 0;max-width:420px;margin:0 auto}
body.en-llamada .controles{display:flex}
.lateral{display:flex;flex-direction:column;align-items:center;gap:5px;width:72px;color:var(--morado);font-size:13px;font-weight:800}
.redondo{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#fff;color:var(--morado);box-shadow:0 4px 14px #4519bb1f}
.redondo svg{width:26px;height:26px}
.hablar{width:84px;height:84px;margin-bottom:6px;border-radius:50%;display:grid;place-items:center;background:var(--morado);color:#fff;box-shadow:0 8px 22px #4519bb55;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .15s,background .15s}
.hablar svg{width:34px;height:34px}
body.grabando .hablar{background:var(--rojo);transform:scale(1.12);box-shadow:0 0 0 8px #e0334933}
body.grabando.cancelando .hablar{background:var(--gris)}
.hablar-texto{display:none;margin:6px 0 0;text-align:center;font-size:13px;font-weight:800;color:var(--morado)}
body.en-llamada .hablar-texto{display:block}
body.grabando .hablar-texto{color:var(--rojo)}
.modo{display:none;width:max-content;margin:8px auto 0;padding:3px;border-radius:999px;background:var(--morado-suave)}
body.en-llamada .modo{display:flex}
.modo button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800;color:var(--gris)}
.modo button[aria-pressed=true]{background:#fff;color:var(--morado);box-shadow:0 1px 6px #4519bb22}
.escribir{display:flex;gap:8px;margin-top:8px}
.escribir[hidden]{display:none}
.escribir input{flex:1;min-width:0;padding:12px 14px;border-radius:999px;border:1.5px solid var(--morado-claro);background:#fff}
.enviar{padding:0 18px;border-radius:999px;background:var(--morado);color:#fff;font-weight:900}

/* Hoja inferior: temas y reportes */
.icono{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--morado-suave)}
.hoja{position:absolute;left:0;right:0;bottom:0;max-height:78%;display:flex;flex-direction:column;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 30px #4519bb26;z-index:5}
.hoja[hidden]{display:none}
.hoja-cabecera{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;font-size:17px}
.hoja-cuerpo{overflow:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:10px}
.hoja-cuerpo[hidden]{display:none}
.opcion-tema{text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--borde);font-weight:700}
.opcion-tema[aria-pressed="true"]{border-color:var(--morado);background:var(--morado-suave);color:var(--morado)}
.lienzo-th{position:absolute;inset:0}
.lienzo-th canvas{display:block}
body.vivo .hablar{background:var(--verde,#14a37f);animation:pulso 2.4s ease-in-out infinite}
body.vivo.mudo .hablar{background:var(--gris);animation:none}
body.vivo .hablar-texto{color:var(--verde,#14a37f)}
body.vivo.mudo .hablar-texto{color:var(--gris)}
@keyframes pulso{0%,100%{box-shadow:0 0 0 0 #14a37f55}50%{box-shadow:0 0 0 12px #14a37f00}}
/* Escucha en vivo: el botón y el marco laten con la voz del alumno (--nivel, 0–1, lo pone practice.js);
   mientras el tutor piensa, un aro gira; lo que dice el alumno aparece con un cursor que parpadea. */
.hablar{position:relative}
.hablar::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:3px solid transparent;opacity:0;transition:opacity .2s}
body.vivo:not(.mudo) .hablar{animation:none;transform:scale(calc(1 + var(--nivel,0) * .14));box-shadow:0 0 0 calc(4px + var(--nivel,0) * 18px) #14a37f30,0 0 0 calc(var(--nivel,0) * 34px) #14a37f14;transition:transform .08s linear,box-shadow .08s linear}
body.en-llamada:has(#stage[data-phase=thinking]) .hablar::after,body.en-llamada:has(#stage[data-phase=voice-loading]) .hablar::after{opacity:1;border-top-color:var(--naranja);border-right-color:#f59e0b55;animation:girar .9s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
@keyframes cursor{to{visibility:hidden}}
/* Reportar una respuesta de la IA: enlace discreto y formulario en la hoja inferior. */
.enlace.discreto{color:var(--gris);font-weight:700}
.reporte-ayuda{margin:0;color:var(--gris);font-size:14px}
.reporte-cita{margin:0;padding:10px 12px;border-radius:12px;background:var(--morado-suave);white-space:pre-wrap;overflow-wrap:anywhere;max-height:7.5em;overflow:auto}
.reporte-motivos{display:flex;flex-wrap:wrap;gap:8px}
.reporte-motivos button{padding:8px 14px;border-radius:999px;border:1.5px solid var(--borde);font-weight:700;font-size:14px}
.reporte-motivos button[aria-pressed="true"]{border-color:var(--morado);background:var(--morado-suave);color:var(--morado)}
.reporte textarea{font:inherit;padding:10px 12px;border-radius:14px;border:1.5px solid var(--morado-claro);resize:vertical;min-height:64px}
.reporte-enviar{padding:12px 18px;align-self:stretch}
.reporte-gracias{margin:12px 0;text-align:center;font-weight:800;color:var(--verde)}
.reporte [hidden]{display:none}
@media(prefers-reduced-motion:reduce){.lumo2d,.hablar,#stage,.reloj::before{transition:none;animation:none}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/build/three.module.js","three/addons/":"./vendor/examples/jsm/"}}</script>
<section id="selection"><p id="eyebrow">ONELINGO · TUTOR CON IA</p><h1>Una conversación, a tu ritmo.</h1><p id="selectionCopy">Elige a tu tutor.</p><p id="authStatus" role="status">Conectando con tu sesión…</p><div id="gallery"></div></section>
<section id="session" class="llamada" hidden>
 <div id="stage" data-phase="loading"><div id="loading" class="cargando">Cargando…</div>
  <button id="end" class="sobre" type="button" aria-label="Terminar la llamada">✕</button>
  <span id="reloj" class="sobre reloj" aria-hidden="true">00:00</span>
  <button id="velocidad" class="sobre" type="button" aria-label="Velocidad de la voz">1x</button>
  <button id="explica" class="sobre" type="button" hidden><span id="explicaNombre"></span></button>
  <div class="quien"><strong id="name">Tutor</strong><button id="tema" class="tema" type="button" aria-label="Cambiar el tema de la conversación"><span id="temaNombre">Conversación libre</span><b aria-hidden="true">▾</b></button></div>
  <div id="insignia" class="insignia" aria-hidden="true" hidden></div>
  <span id="state" class="solo-lector" role="status">Preparando…</span>
 </div>
 <div id="chat" class="chat"><div class="columna">
  <div id="messages" class="mensajes" role="log" aria-live="polite"></div>
  <div id="alumnoVivo" class="mensajes" style="margin-top:12px"></div>
  <div id="ideas" class="ideas" hidden></div>
 </div></div>
 <div class="abajo columna">
  <p id="status" class="pista" role="status"></p>
  <p id="error" class="aviso" role="alert"></p>
  <form id="form" class="escribir" hidden><input id="text" autocomplete="off" maxlength="600" placeholder="Escribe tu respuesta…" aria-label="Tu mensaje"><button id="send" class="enviar">Enviar</button></form>
  <div class="llamada-inicio"><p id="llamaTexto" class="llama-texto"></p><button id="llamar" class="llamar" type="button" disabled><span aria-hidden="true">📞</span><span id="llamarTexto">Contestar</span></button></div>
  <div class="controles">

   <button id="hablar" class="hablar" type="button" aria-label="Mantén pulsado para hablar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
   <label class="lateral"><button id="pedirPista" class="redondo" type="button" aria-label="Pedir una pista al tutor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2V16h5v-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></svg></button><span>Ayuda</span></label>
  </div>
  <p id="hablarTexto" class="hablar-texto">Mantén pulsado para hablar</p>
  <div class="modo" role="group" aria-label="Cómo hablas"><button id="modoVivo" type="button" aria-pressed="true">Micrófono abierto</button><button id="modoPulsar" type="button" aria-pressed="false">Mantener pulsado</button></div>
 </div>
 <div id="panel" class="hoja" role="dialog" aria-labelledby="panelTitulo" hidden>
  <div class="hoja-cabecera"><strong id="panelTitulo">Temas</strong><button id="cerrarPanel" class="icono" type="button" aria-label="Cerrar">✕</button></div>

   <div id="reporteMotivos" class="reporte-motivos" role="group" aria-label="Motivo del reporte"></div>
   <textarea id="reporteComentario" maxlength="500" rows="3" placeholder="Comentario (opcional)" aria-label="Comentario (opcional)"></textarea>
   <p id="reporteAviso" class="aviso" role="alert"></p>
   <button id="reporteEnviar" class="enviar reporte-enviar" type="submit" disabled>Enviar reporte</button>
  </form>
 </div>
 <audio id="audio" preload="auto" playsinline></audio>
</section>
