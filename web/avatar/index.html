<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tutores IA · OneLingo</title>
<style>
/* Diseño de OneLingo (theme.dart): crema, morado #4519BB, Nunito. */
@font-face{font-family:Nunito;src:url('../assets/assets/fonts/Nunito.ttf') format('truetype');font-weight:200 1000;font-display:swap}
:root{--morado:#4519BB;--morado-oscuro:#2E0F86;--morado-claro:#E6DEFF;--morado-suave:#F3F0FF;--texto:#1C1B1B;--gris:#79758A;--borde:#EBE8E6;--verde:#40A652;--verde-suave:#E0F4E3;--rojo:#E03349;--naranja:#F7941D;--fondo:#FCF9F8}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font:16px Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
button:disabled{opacity:.45;cursor:default}

/* Galería (solo fuera de la app) */
#selection{max-width:1000px;margin:auto;padding:20px}
#selection h1{font-weight:900;margin:6px 0}#selection p{color:var(--gris)}
#eyebrow{color:var(--morado)!important;font-weight:900;letter-spacing:.06em;font-size:13px}
#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tutor{position:relative;padding:0;overflow:hidden;text-align:left;background:#fff;border-radius:20px;border:1.5px solid var(--borde)}
.portrait{aspect-ratio:.82;background:var(--morado-claro)}.portrait img{width:100%;height:100%;object-fit:cover;object-position:top}
.tutor strong,.tutor small{display:block;padding:8px 12px 0}.tutor small{color:var(--gris);font-size:12px;padding-bottom:12px}
.recommended{position:absolute;top:9px;left:9px;background:var(--naranja);color:#fff;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}
body.embebido #selection{display:none}

/* Llamada: pantalla completa, el tutor centrado, controles abajo. */
.llamada{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#fff 0%,var(--morado-suave) 55%,var(--morado-claro) 100%);overflow:hidden}
.llamada[hidden]{display:none}
.columna{width:100%;max-width:560px;margin:0 auto;padding:0 16px}
.cabecera{display:flex;align-items:center;gap:10px;padding-top:12px}
.quien{flex:1;text-align:center;line-height:1.2}
.quien strong{display:block;font-size:20px;font-weight:900}
.quien span{font-size:13px;color:var(--gris);font-weight:700}
.icono{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:#ffffffb0;position:relative}
.icono:hover{background:#fff}
.contador{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--naranja);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;padding:0 4px}
.contador[hidden]{display:none}
.tema{display:flex;align-items:center;gap:6px;margin:8px auto 0;padding:7px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--morado-claro);color:var(--morado);font-weight:800;font-size:14px;max-width:calc(100% - 32px)}
.tema span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stage{position:relative;flex:1;min-height:150px}
#stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.lumo2d{position:absolute;inset:4% 0 0;pointer-events:none;transform-origin:50% 75%;transition:transform .45s ease}
.lumo2d img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 50%}
.lumo2d img[hidden]{display:none}
.lumo2d.pensando{transform:rotate(-3deg)}
.cargando{position:absolute;inset:0;display:grid;place-content:center;color:var(--morado);font-weight:800}
.cargando[hidden]{display:none}
.abajo{padding-bottom:max(14px,env(safe-area-inset-bottom))}

/* Subtítulos */
.subtitulos{text-align:center;min-height:24px}
.sub-tutor{margin:0;font-size:19px;font-weight:800;line-height:1.35}
.sub-traduccion{margin:4px 0 0;color:var(--gris);font-size:14px}
.sub-alumno{margin:8px auto 0;display:table;max-width:92%;background:var(--morado);color:#fff;border-radius:16px 16px 4px 16px;padding:7px 12px;font-size:15px;font-weight:700}
.sub-acciones{display:flex;justify-content:center;gap:14px;margin-top:4px}
.enlace{color:var(--morado);font-weight:800;font-size:13px;padding:4px}
.nota{display:block;margin:8px auto 0;padding:6px 12px;border-radius:12px;background:#FFF4E5;border:1.5px solid #F7941D55;font-size:14px;font-weight:700;color:#7A4300}
.nota s{color:var(--rojo)}.nota b{color:#197D58}
.ideas{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
.ideas[hidden],.sub-traduccion[hidden],.sub-alumno[hidden],.nota[hidden],.enlace[hidden]{display:none}
.ideas-titulo{width:100%;text-align:center;font-size:12px;font-weight:900;color:var(--gris);letter-spacing:.04em;text-transform:uppercase}
.idea{padding:7px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--morado-claro);color:var(--morado);font-size:14px;font-weight:700}
.pista{margin:8px 0 0;text-align:center;font-size:13px;color:var(--gris);font-weight:700;min-height:18px}
.aviso{margin:6px 0 0;text-align:center;font-size:14px;color:var(--rojo);font-weight:700}
.aviso:empty{display:none}
.aviso button{color:var(--morado);font-weight:900;text-decoration:underline;margin-left:6px}

/* Antes de contestar (y al colgar) no se ve lo que dirá el tutor. */
body:not(.en-llamada) .subtitulos,body:not(.en-llamada) .ideas,body:not(.en-llamada) .pista{display:none}
/* Llamada entrante / terminada */
.llamada-inicio{display:none;flex-direction:column;align-items:center;gap:10px;padding:12px 0 6px}
body.puede-llamar:not(.en-llamada) .llamada-inicio{display:flex}
.llama-texto{margin:0;font-weight:900;font-size:17px}
.llamar{display:flex;align-items:center;gap:10px;padding:15px 30px;border-radius:999px;background:var(--verde);color:#fff;font-size:18px;font-weight:900;box-shadow:0 8px 22px #40a65255}
.llamar:hover{background:#2F8F40}

/* Controles */
.controles{display:none;align-items:center;justify-content:center;gap:28px;padding-top:12px}
body.en-llamada .controles{display:flex}
.redondo{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:#fff;box-shadow:0 4px 14px #4519bb1f}
.colgar{background:var(--rojo);color:#fff}.colgar span{display:inline-block;transform:rotate(135deg)}
.hablar{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:var(--morado);color:#fff;font-size:30px;box-shadow:0 8px 22px #4519bb55;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .15s,background .15s}
body.grabando .hablar{background:var(--rojo);transform:scale(1.12);box-shadow:0 0 0 8px #e0334933}
body.grabando.cancelando .hablar{background:var(--gris)}
.hablar-texto{display:none;margin:8px 0 0;text-align:center;font-size:13px;font-weight:800;color:var(--morado)}
body.en-llamada .hablar-texto{display:block}
body.grabando .hablar-texto{color:var(--rojo)}
.escribir{display:flex;gap:8px;margin-top:10px}
.escribir[hidden]{display:none}
.escribir input{flex:1;min-width:0;padding:12px 14px;border-radius:999px;border:1.5px solid var(--morado-claro);background:#fff}
.enviar{padding:0 18px;border-radius:999px;background:var(--morado);color:#fff;font-weight:900}

/* Hoja inferior: conversación y temas */
.hoja{position:absolute;left:0;right:0;bottom:0;max-height:78%;display:flex;flex-direction:column;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 30px #4519bb26;z-index:5}
.hoja[hidden]{display:none}
.hoja-cabecera{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;font-size:17px}
.hoja-cuerpo{overflow:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:10px}
.hoja-cuerpo[hidden]{display:none}
.bubble{padding:11px 14px;border-radius:16px;background:var(--morado-suave);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4;max-width:88%}
.bubble.mine{align-self:flex-end;background:var(--morado);color:#fff}
.bubble.feedback{align-self:center;background:none;color:var(--gris);font-size:13px}
.traduccion{margin-top:6px;font-size:13px;color:var(--gris)}.traduccion summary{cursor:pointer;color:var(--morado);font-weight:800}
.romanizacion{display:block;margin-top:4px;font-size:13px;color:var(--gris)}
.correccion{background:#FFF4E5;border:1.5px solid #F7941D55;border-radius:14px;padding:10px 12px;display:grid;gap:4px}
.correccion-titulo{font-size:11px;font-weight:900;color:#B25E00;letter-spacing:.04em;text-transform:uppercase}
.correccion-fila{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}.correccion s{color:var(--rojo)}.correccion strong{color:#197D58}.correccion small{color:var(--gris)}.flecha{color:var(--gris)}
.resumen{border:2px solid var(--morado-claro);border-radius:18px;padding:12px 14px}.resumen h3{margin:0 0 6px;color:var(--morado)}.resumen h4{margin:10px 0 4px;font-size:14px}.resumen ul{margin:0;padding-left:18px;display:grid;gap:4px}.resumen li small{display:block;color:var(--gris)}.resumen s{color:var(--rojo)}.resumen strong{color:#197D58}.resumen .siguiente{margin:10px 0 0;padding:10px 12px;border-radius:14px;background:var(--verde-suave);color:#1F5A2B;font-weight:700}
.opcion-tema{text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--borde);font-weight:700}
.opcion-tema[aria-pressed="true"]{border-color:var(--morado);background:var(--morado-suave);color:var(--morado)}
@media(prefers-reduced-motion:reduce){.lumo2d,.hablar{transition:none}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/build/three.module.js","three/addons/":"./vendor/examples/jsm/"}}</script>
<section id="selection"><p id="eyebrow">ONELINGO · TUTOR CON IA</p><h1>Una conversación, a tu ritmo.</h1><p id="selectionCopy">Elige a tu tutor.</p><p id="authStatus" role="status">Conectando con tu sesión…</p><div id="gallery"></div></section>
<section id="session" class="llamada" hidden>
 <header class="cabecera columna">
  <button id="back" class="icono" type="button" aria-label="Volver a los tutores">←</button>
  <div class="quien"><strong id="name">Tutor</strong><span id="state">Preparando…</span></div>
  <button id="verConversacion" class="icono" type="button" aria-label="Ver la conversación">💬<span id="contador" class="contador" hidden></span></button>
 </header>
 <button id="tema" class="tema" type="button" aria-label="Cambiar el tema de la conversación"><span id="temaNombre">Conversación libre</span><b aria-hidden="true">▾</b></button>
 <div id="stage" data-phase="loading"><div id="loading" class="cargando">Cargando…</div></div>
 <div class="abajo columna">
  <div class="subtitulos" aria-live="polite">
   <p id="subTutor" class="sub-tutor"></p>
   <p id="subTraduccion" class="sub-traduccion" hidden></p>
   <div class="sub-acciones"><button id="replay" class="enlace" type="button" hidden>↻ Repetir</button><button id="verTraduccion" class="enlace" type="button" hidden>Ver traducción</button></div>
   <p id="subAlumno" class="sub-alumno" hidden></p>
   <button id="nota" class="nota" type="button" hidden></button>
  </div>
  <div id="ideas" class="ideas" hidden></div>
  <p id="status" class="pista" role="status"></p>
  <p id="error" class="aviso" role="alert"></p>
  <div class="llamada-inicio"><p id="llamaTexto" class="llama-texto"></p><button id="llamar" class="llamar" type="button" disabled><span aria-hidden="true">📞</span><span id="llamarTexto">Contestar</span></button></div>
  <form id="form" class="escribir" hidden><input id="text" autocomplete="off" maxlength="600" placeholder="Escribe tu respuesta…" aria-label="Tu mensaje"><button id="send" class="enviar">Enviar</button></form>
  <div class="controles">
   <button id="teclado" class="redondo" type="button" aria-label="Escribir en lugar de hablar">⌨️</button>
   <button id="hablar" class="hablar" type="button" aria-label="Mantén pulsado para hablar">🎙</button>
   <button id="end" class="redondo colgar" type="button" aria-label="Colgar la llamada"><span aria-hidden="true">📞</span></button>
  </div>
  <p id="hablarTexto" class="hablar-texto">Mantén pulsado para hablar</p>
 </div>
 <div id="panel" class="hoja" role="dialog" aria-labelledby="panelTitulo" hidden>
  <div class="hoja-cabecera"><strong id="panelTitulo">Conversación</strong><button id="cerrarPanel" class="icono" type="button" aria-label="Cerrar">✕</button></div>
  <div id="messages" class="hoja-cuerpo" role="log"></div>
  <div id="temas" class="hoja-cuerpo" hidden></div>
 </div>
 <audio id="audio" preload="auto" playsinline></audio>
</section>
<script type="module" src="./practice.js?v=27"></script></html>
