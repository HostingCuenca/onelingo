<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sala de pruebas · tutores en vivo</title>
<style>
:root{--morado:#4519BB;--suave:#EEE9FF;--fondo:#F7F4F2;--linea:#E6DFDA;--gris:#6E6979}
*{box-sizing:border-box}body{margin:0;background:var(--fondo);font:15px system-ui,sans-serif;color:#1C1B1B}
main{max-width:1100px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:800px){main{grid-template-columns:1fr}}
#escena{position:relative;aspect-ratio:3/4;max-height:80vh;background:radial-gradient(circle at 50% 35%,#fff,#E9E3F7);border-radius:20px;overflow:hidden;border:1px solid var(--linea)}
.lienzo-th{position:absolute;inset:0}.lienzo-th canvas{display:block}
#estado{position:absolute;left:12px;bottom:10px;font-size:13px;color:var(--gris)}
#subs{position:absolute;left:12px;right:12px;bottom:34px;text-align:center;font-weight:700;text-shadow:0 1px 3px #fff;z-index:1}
.tarjeta{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:14px;margin-bottom:12px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:14px;margin:0 0 8px}.muted{color:var(--gris);font-size:13px;margin:0}
select,button{font:inherit}select{width:100%;padding:9px 11px;border:1px solid var(--linea);border-radius:10px;background:#fff}
#tutores{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
#tutores button{border:2px solid transparent;border-radius:12px;padding:0;background:var(--suave);cursor:pointer;overflow:hidden;color:#1C1B1B;font-weight:700;font-size:12px}
#tutores button[aria-pressed=true]{border-color:var(--morado)}
#tutores img{display:block;width:100%;aspect-ratio:9/11;object-fit:cover;object-position:top}
#tutores span{display:block;padding:4px 0}
#frases{display:flex;flex-direction:column;gap:8px}
#frases button,.accion{text-align:left;padding:10px 12px;border:0;border-radius:10px;background:var(--suave);color:var(--morado);font-weight:600;cursor:pointer}
#frases button:disabled{opacity:.5;cursor:wait}#frases button.sonando{background:var(--morado);color:#fff}
.accion{background:var(--morado);color:#fff;text-align:center;margin-top:10px;width:100%}
</style>
<script type="importmap">{"imports":{"three":"/avatar/vendor/build/three.module.js","three/addons/":"/avatar/vendor/examples/jsm/"}}</script>
<main>
  <div id="escena"><div id="subs"></div><div id="estado">Cargando…</div></div>
  <div>
    <div class="tarjeta"><h1>Sala de pruebas · tutores en vivo</h1><p class="muted">El mismo visor, voz y movimiento de boca que la app. Las frases ya están generadas (precargar.ts): suenan al instante.</p></div>
    <div class="tarjeta"><h2>Tutor</h2><div id="tutores"></div></div>
    <div class="tarjeta">
      <h2><label for="idioma">Idioma</label></h2>
      <select id="idioma"></select>
      <h2 style="margin-top:12px">Frases</h2>
      <div id="frases"></div>
      <button class="accion" id="todas">Escuchar las tres</button>
      <p class="muted" id="info" style="margin-top:8px"></p>
    </div>
  </div>
</main>
<script type="module">
import {createAvatarTH} from '/avatar/avatar-th.js?v=10';
import {lineaDeVisemas, alineacionEstimada} from '/avatar/visemas.js?v=1';
const $ = id => document.getElementById(id), estado = t => $('estado').textContent = t;
const IDIOMAS = {es: 'Español', en: 'Inglés', pt: 'Portugués', fr: 'Francés', de: 'Alemán', it: 'Italiano', ru: 'Ruso', ko: 'Coreano', ja: 'Japonés', zh: 'Chino'};
const [roster, FRASES] = await Promise.all([fetch('/avatar/roster.json?_=' + Date.now()).then(r => r.json()), fetch('frases.json?_=' + Date.now()).then(r => r.json())]);
const TUTORES = roster.tutors.filter(t => t.tipo === 'th');
const escena = $('escena'), audio = new Audio();
let tutor = TUTORES[0], avatar = null, linea = null, turno = 0;
const listas = new Map(); // `${tutor}|${idioma}` → promesas de las tres frases
const fuente = {reloj: () => ({hablando: !audio.paused && !audio.ended, ms: audio.currentTime * 1000, linea})};
audio.addEventListener('ended', () => { escena.dataset.phase = 'ready'; for (const b of $('frases').children) b.classList.remove('sonando'); });

$('idioma').append(...Object.entries(IDIOMAS).map(([v, t]) => new Option(t, v)));
$('tutores').append(...TUTORES.map(t => {
  const b = document.createElement('button'); b.dataset.id = t.id;
  b.innerHTML = `<img alt="" src="/avatar/${t.portrait}"><span>${t.name}</span>`;
  b.onclick = () => elegirTutor(t); return b;
}));

async function elegirTutor(t) {
  tutor = t; audio.pause();
  for (const b of $('tutores').children) b.setAttribute('aria-pressed', String(b.dataset.id === t.id));
  avatar?.dispose(); const mio = ++turno;
  estado(`Cargando a ${t.name}…`);
  avatar = createAvatarTH(escena, fuente, t.th || {});
  escena.dataset.phase = 'ready';
  pintarFrases();
  await avatar.load('/avatar/' + t.model, ev => { if (ev.lengthComputable) estado(`Cargando a ${t.name}… ${Math.round(ev.loaded / ev.total * 100)} %`); });
  if (mio !== turno) return;
  window.head = escena.querySelector('.lienzo-th')?.cabeza; // para capturas desde la consola
  estado(`${t.name} · listo`);
}

// Pide (o reusa) las tres frases del tutor y el idioma actuales.
function frasesDe(t, idioma) {
  const k = `${t.id}|${idioma}`;
  if (!listas.has(k)) listas.set(k, (FRASES[idioma] || []).map(texto => fetch('voz', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({texto, idioma, tutor: t.id})})
    .then(async r => { const d = await r.json(); if (!r.ok) throw new Error(d.error);
      const url = URL.createObjectURL(new Blob([Uint8Array.from(atob(d.audio), c => c.charCodeAt(0))], {type: 'audio/mpeg'}));
      return {texto, url, voz: d.voz, cache: d.cache, linea: d.alineacion ? lineaDeVisemas(d.alineacion, idioma) : null}; })));
  return listas.get(k);
}

function pintarFrases() {
  const idioma = $('idioma').value, promesas = frasesDe(tutor, idioma);
  $('frases').replaceChildren(...promesas.map((p, i) => {
    const b = document.createElement('button'); b.textContent = FRASES[idioma][i]; b.disabled = true;
    p.then(f => { b.disabled = false; b.onclick = () => decir(f, b); }, e => { b.textContent += ` (error: ${e.message})`; });
    return b;
  }));
  Promise.allSettled(promesas).then(r => { const ok = r.filter(x => x.status === 'fulfilled').map(x => x.value);
    if (ok.length) $('info').textContent = `Voz «${ok[0].voz}» · ${ok.filter(f => f.cache).length}/${ok.length} desde caché · boca: ${ok.every(f => f.linea) ? 'tiempo real de cada letra' : 'estimada'}`; });
}

function decir(f, boton) {
  return new Promise(fin => {
    for (const b of $('frases').children) b.classList.toggle('sonando', b === boton);
    audio.pause(); audio.src = f.url; linea = f.linea;
    audio.onloadedmetadata = () => { if (!linea && isFinite(audio.duration)) linea = lineaDeVisemas(alineacionEstimada(f.texto, audio.duration), $('idioma').value); };
    $('subs').textContent = f.texto; escena.dataset.phase = 'speaking';
    audio.addEventListener('ended', fin, {once: true}); audio.addEventListener('pause', fin, {once: true});
    audio.play().catch(e => { estado('No se pudo reproducir: ' + e.message); fin(); });
  });
}

$('todas').onclick = async () => {
  const fs = await Promise.all(frasesDe(tutor, $('idioma').value)), botones = [...$('frases').children];
  for (const [i, f] of fs.entries()) { await decir(f, botones[i]); if (audio.currentTime < audio.duration - 0.05) break; await new Promise(r => setTimeout(r, 500)); }
};
$('idioma').onchange = () => { audio.pause(); $('subs').textContent = ''; pintarFrases(); };
elegirTutor(TUTORES.find(t => t.id === new URLSearchParams(location.search).get('tutor')) || TUTORES[0]).catch(e => estado('Error: ' + e.message));
</script></html>
