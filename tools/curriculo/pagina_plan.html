<title>Plan del francés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Cuaderno Seyès: papel pautado con margen rojo en la cabecera; tinta azul para lo que se aprueba. */
:root {
  --paper: #f6f7fa; --sheet: #ffffff; --ink: #1d2433; --muted: #5d6679; --line: #dde2ec;
  --accent: #2b45a8; --accent-soft: #e6eaf8; --margin: #c9434e; --margin-soft: #fbe9ea;
  --ok: #24785a; --ok-soft: #e2f3ec; --wait: #8a6a12; --wait-soft: #f8f0d8;
  --seyes: rgba(43, 69, 168, .10);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11141c; --sheet: #181c27; --ink: #e8ebf3; --muted: #9aa3b8; --line: #2a3142;
  --accent: #8ea4ff; --accent-soft: #232c4d; --margin: #ff7d86; --margin-soft: #3a1d22;
  --ok: #5fd0a2; --ok-soft: #173329; --wait: #e2c26a; --wait-soft: #332a12; --seyes: rgba(142, 164, 255, .10);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #11141c; --sheet: #181c27; --ink: #e8ebf3; --muted: #9aa3b8; --line: #2a3142;
  --accent: #8ea4ff; --accent-soft: #232c4d; --margin: #ff7d86; --margin-soft: #3a1d22;
  --ok: #5fd0a2; --ok-soft: #173329; --wait: #e2c26a; --wait-soft: #332a12; --seyes: rgba(142, 164, 255, .10);
  color-scheme: dark }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--f-body); }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 700; }
h3 { font-size: 18px; font-weight: 700; }
.mono { font-family: var(--f-mono); font-size: 12.5px; }
.muted { color: var(--muted); }
header.hero { background:
  linear-gradient(90deg, transparent 52px, var(--margin) 52px, var(--margin) 54px, transparent 54px),
  repeating-linear-gradient(180deg, transparent 0 23px, var(--seyes) 23px 24px), var(--sheet);
  border-bottom: 1px solid var(--line); }
header.hero .wrap { padding-block: 28px 22px; padding-left: max(16px, 72px); display: grid; gap: 14px; }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; font-weight: 700; color: var(--accent); }
.lead { max-width: 68ch; margin: 0; color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 10px 28px; font-variant-numeric: tabular-nums; }
.stat b { font-family: var(--f-display); font-size: 22px; display: block; }
.stat span { font-size: 13px; color: var(--muted); }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px; scrollbar-width: thin; }
.tab { flex: none; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); border-radius: 999px;
  padding: 6px 12px; font: 600 14px var(--f-body); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.tab:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dot.pub { background: var(--ok); } .dot.ok { background: var(--accent); } .dot.cambios { background: var(--margin); }
.tab[aria-selected="true"] .dot { outline: 2px solid var(--sheet); }
main { display: grid; gap: 20px; padding-top: 20px; }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.pub { background: var(--ok-soft); color: var(--ok); }
.chip.plan { background: var(--wait-soft); color: var(--wait); }
.chip.ok { background: var(--accent-soft); color: var(--accent); }
.chip.cambios { background: var(--margin-soft); color: var(--margin); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr.link { cursor: pointer; } tbody tr.link:hover td { background: var(--accent-soft); }
.review { border-left: 4px solid var(--accent); }
.review textarea, .note textarea { width: 100%; min-height: 70px; font: 15px/1.45 var(--f-body); color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; box-sizing: border-box; resize: vertical; }
button.btn { font: 600 14px var(--f-body); border-radius: 8px; padding: 8px 14px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); cursor: pointer; }
button.btn.primary { background: var(--accent); color: var(--sheet); border-color: var(--accent); }
button.btn.warn { color: var(--margin); border-color: var(--margin); }
button.btn:disabled { opacity: .5; cursor: default; }
.search { width: 100%; box-sizing: border-box; font: 15px var(--f-body); padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--sheet); color: var(--ink); }
.block-head { display: grid; gap: 4px; padding: 4px 2px; }
.block-head .n { font-family: var(--f-mono); font-size: 12px; color: var(--margin); font-weight: 600; letter-spacing: .04em; }
details.clase { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); }
details.clase + details.clase { margin-top: 8px; }
details.clase > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: 2.6em 1fr auto; gap: 10px; align-items: start; }
details.clase > summary::-webkit-details-marker { display: none; }
details.clase > summary .k { font-family: var(--f-mono); color: var(--muted); font-size: 13px; padding-top: 2px; font-variant-numeric: tabular-nums; }
details.clase > summary .t { min-width: 0; display: grid; gap: 2px; }
details.clase > summary .t strong { font-weight: 700; }
details.clase > summary .t small { color: var(--muted); font-size: 14px; }
details.clase[open] > summary { border-bottom: 1px solid var(--line); }
.ficha { padding: 14px; display: grid; gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 20px; }
.field { min-width: 0; }
.field h4 { margin: 0 0 4px; font: 700 12px var(--f-body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.field ul { margin: 0; padding-left: 18px; }
.field p { margin: 0; }
.keys { display: flex; flex-wrap: wrap; gap: 4px; }
.key { font-family: var(--f-mono); font-size: 12px; padding: 1px 7px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line); }
.key.new { border-color: var(--accent); color: var(--accent); }
.fr { font-style: italic; }
details.pub { border: 1px dashed var(--ok); border-radius: 8px; background: var(--ok-soft); }
details.pub > summary { cursor: pointer; padding: 8px 12px; font-weight: 700; color: var(--ok); }
details.pub > div { padding: 4px 12px 12px; display: grid; gap: 12px; background: var(--sheet); border-radius: 0 0 8px 8px; }
.expl { white-space: pre-line; }
.dlg { display: grid; gap: 4px; }
.dlg div { display: grid; grid-template-columns: minmax(70px, auto) 1fr; gap: 8px; }
.dlg b { font-weight: 600; color: var(--accent); }
.note { display: grid; gap: 6px; }
.ej { display: grid; gap: 10px; }
.ej-grupo h4 { margin: 0 0 6px; font: 700 12px var(--f-body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.ej-grupo ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.ej-grupo li { padding-left: 2px; }
.fmt { font: 600 11.5px var(--f-mono); padding: 1px 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); margin-right: 6px; }
.resp { color: var(--ok); font-weight: 600; }
.clave { font: 11.5px var(--f-mono); color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper);
  padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; }
.cols { columns: 2 280px; column-gap: 28px; }
.cols li { break-inside: avoid; margin-bottom: 4px; }
@media (prefers-reduced-motion: no-preference) { details.clase { transition: border-color .15s; } details.clase:hover { border-color: var(--accent); } }
</style>

<header class="hero"><div class="wrap">
  <div class="eyebrow">OneLingo · Francés de Francia · revisión del plan</div>
  <h1>Plan del francés</h1>
  <p class="lead">Las 500 clases de N1 a N10, ficha por ficha, con lo que ya está publicado en N1 y N2. Aprueba cada nivel o pide cambios, y deja notas en las clases que quieras ajustar: Claude las lee y las aplica antes de escribir ese nivel.</p>
  <div class="stats" id="stats"></div>
</div></header>
<nav class="tabs" aria-label="Niveles"><div class="wrap" id="tabs" role="tablist"></div></nav>
<div class="wrap"><main id="main"></main></div>
<div class="toast" id="toast" hidden></div>

<script>
const DATA = /*DATOS*/null;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab = 'resumen', filtro = '', rev = {}, db = null, userId = '';
try { tab = localStorage.getItem('plan-tab') || 'resumen'; } catch (e) {}

const docId = k => k.replace(/[^a-zA-Z0-9_-]/g, '-');
const estadoNivel = n => (rev[docId('nivel-n' + n)] || {}).estado || '';
const publicadas = nv => nv.clases.filter(c => c.estado === 'publicado').length;
const fecha = s => { try { return new Date(s).toLocaleDateString('es', {day: 'numeric', month: 'short'}); } catch (e) { return ''; } };

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }

function chipRevision(r) {
  if (!r || !r.estado) return '<span class="chip plan">Sin revisar</span>';
  return r.estado === 'aprobado' ? `<span class="chip ok">Aprobado · ${esc(fecha(r.fecha))}</span>`
    : `<span class="chip cambios">Pide cambios · ${esc(fecha(r.fecha))}</span>`;
}

function renderStats() {
  const tot = DATA.niveles.reduce((a, n) => a + n.clases.length, 0);
  const pub = DATA.niveles.reduce((a, n) => a + publicadas(n), 0);
  const nivPub = DATA.niveles.filter(n => n.clases.length && publicadas(n) === n.clases.length).length;
  const aprob = DATA.niveles.filter(n => estadoNivel(n.nivel) === 'aprobado').length;
  const notas = Object.keys(rev).filter(k => k.startsWith('clase-') && rev[k].nota).length;
  $('#stats').innerHTML = [
    [`${pub}/${tot}`, 'clases publicadas'], [`${nivPub}/10`, 'niveles en la app'],
    [`${aprob}/10`, 'niveles aprobados por ti'], [notas, 'notas en clases'],
    [DATA.extra.situaciones ?? '—', 'situaciones × 3 tramos'], [DATA.extra.verbos ?? '—', 'verbos conjugados'],
  ].map(([b, s]) => `<div class="stat"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join('');
}

function renderTabs() {
  const items = [['resumen', 'Resumen', '']].concat(DATA.niveles.map(n => {
    const e = estadoNivel(n.nivel), p = publicadas(n) === n.clases.length && n.clases.length;
    return ['n' + n.nivel, `N${n.nivel} · ${n.cefr}`, e === 'aprobado' ? 'ok' : e === 'cambios' ? 'cambios' : p ? 'pub' : ''];
  }), [['personajes', 'Personajes', '']]);
  $('#tabs').innerHTML = items.map(([id, label, dot]) =>
    `<button class="tab" role="tab" aria-selected="${id === tab}" data-tab="${id}">${dot !== undefined && id.startsWith('n') ? `<span class="dot ${dot}"></span>` : ''}${esc(label)}</button>`).join('');
}

function renderResumen() {
  const filas = DATA.niveles.map(n => {
    const p = publicadas(n), t = n.clases.length;
    return `<tr class="link" data-tab="n${n.nivel}"><td class="num"><b>N${n.nivel}</b></td><td>${esc(n.cefr)}</td><td><b>${esc(n.titulo)}</b><br><small class="muted">${esc(n.objetivo)}</small></td>
      <td>${esc(n.examen)}</td><td class="num">${p === t ? `<span class="chip pub">${t} publicadas</span>` : p ? `<span class="chip pub">${p}/${t}</span>` : `<span class="chip plan">${t} planificadas</span>`}</td>
      <td>${chipRevision(rev[docId('nivel-n' + n.nivel)])}</td></tr>`;
  }).join('');
  const n0 = DATA.antes.nivel0 || [], f0 = DATA.antes.f0 || [];
  return `<section class="panel"><h2>Los diez niveles</h2>
    <p class="muted" style="margin:0">Toca un nivel para ver sus 50 clases. Verde: ya en la app. Azul: lo aprobaste. Rojo: pediste cambios.</p>
    <div class="table-wrap"><table><thead><tr><th>Nivel</th><th>MCER</th><th>Tema y objetivo</th><th>Examen</th><th>Clases</th><th>Tu revisión</th></tr></thead><tbody>${filas}</tbody></table></div></section>
    <section class="panel"><h2>Antes del Nivel 1 (ya en la app)</h2>
      <div class="grid2"><div class="field"><h4>Nivel 0 · Leer y pronunciar · ${n0.reduce((a, u) => a + u[1].length, 0)} lecciones</h4>
        <ol class="cols">${n0.map(u => `<li><b>${esc(u[0])}</b><br><small class="muted">${esc(u[1].join(' · '))}</small></li>`).join('')}</ol></div>
      <div class="field"><h4>Fundamentos · ${f0.length} unidades</h4><ol>${f0.map(u => `<li>${esc(u)}</li>`).join('')}</ol></div></div></section>
    <section class="panel"><h2>Cómo se arma cada clase</h2><div class="grid2">
      <div class="field"><h4>Ficha</h4><p>Título, objetivo, gramática (lo nuevo y lo que repasa), vocabulario, situación y tarea de evaluación. Nada se enseña dos veces.</p></div>
      <div class="field"><h4>Clase</h4><p>Explicación, ejemplos con audio, vocabulario, tabla, práctica guiada e independiente, situación con diálogo y evaluación.</p></div>
      <div class="field"><h4>Control</h4><p>Un autor escribe desde la ficha, un revisor distinto la aprueba, el validador comprueba que no haya palabras sin enseñar.</p></div></div></section>`;
}

function listaPalabras(c) { return c.palabras.map(p => `<span class="fr">${esc(p)}</span>`).join(', '); }

function contenido(c) {
  const k = c.contenido; if (!k) return '';
  const tablas = k.tablas.slice(0, 4).map(t => `<div class="field"><h4>${esc(t.titulo)}</h4><div class="table-wrap"><table>
    ${t.columnas.length ? `<thead><tr>${t.columnas.map(x => `<th>${esc(x)}</th>`).join('')}</tr></thead>` : ''}
    <tbody>${t.filas.map(f => `<tr>${f.map(x => `<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('');
  const s = k.situacion;
  return `<details class="pub"><summary>Ver la clase publicada</summary><div>
    ${k.explicaciones.map(e => `<div class="field"><h4>${esc(e[0])}</h4><p class="expl">${esc(e[1])}</p></div>`).join('')}
    ${tablas}
    <div class="field"><h4>Ejemplos</h4><ul>${k.ejemplos.map(e => `<li><span class="fr">${esc(e[0])}</span> <span class="muted">— ${esc(e[1])}</span></li>`).join('')}</ul></div>
    <div class="field"><h4>Vocabulario</h4><ul class="cols">${k.vocabulario.map(v => `<li><span class="fr">${esc(v[0])}</span> <span class="muted">— ${esc(v[1])}</span></li>`).join('')}</ul></div>
    ${s ? `<div class="field"><h4>Situación</h4><p class="muted">${esc(s.contexto)}</p><div class="dlg">${s.dialogo.map(l => `<div><b>${esc(l[0])}</b><span><span class="fr">${esc(l[1])}</span><br><small class="muted">${esc(l[2])}</small></span></div>`).join('')}</div></div>` : ''}
    ${k.errores.length ? `<div class="field"><h4>Errores frecuentes</h4><ul>${k.errores.map(e => `<li><s class="muted">${esc(e[0])}</s> → <span class="fr">${esc(e[1])}</span><br><small class="muted">${esc(e[2])}</small></li>`).join('')}</ul></div>` : ''}
    ${ejerciciosReales(k.ejercicios)}
  </div></details>`;
}

const ETAPAS = [['guiada', 'Práctica guiada'], ['independiente', 'Práctica independiente'], ['situacion', 'Preguntas de la situación'], ['evaluacion', 'Evaluación']];
function separar(ej) { const i = String(ej || '').lastIndexOf('→'); return i < 0 ? [ej, ''] : [ej.slice(0, i).trim(), ej.slice(i + 1).trim()]; }
function itemPlan(it) {
  const [enun, resp] = separar(it.ejemplo);
  return `<li><span class="fmt">${esc(it.formato)}</span>${esc(it.consigna)}<br><span class="fr">${esc(enun)}</span>${resp ? ` <span class="resp">→ ${esc(resp)}</span>` : ''} <span class="clave">· ${esc(it.clave)}</span></li>`;
}
function planEjercicios(ej) {
  if (!ej) return '';
  return `<div class="ej"><div class="ej-grupo"><h4>Plan de ejercicios</h4></div>${ETAPAS.map(([k, label]) => {
    const items = k === 'situacion' ? (ej.situacion || {}).preguntas || [] : ej[k] || [];
    const extra = k === 'situacion' && ej.situacion ? `<p class="muted" style="margin:0 0 6px">${esc(ej.situacion.texto)}</p>` : '';
    return items.length ? `<div class="ej-grupo"><h4>${label} · ${items.length}</h4>${extra}<ol>${items.map(itemPlan).join('')}</ol></div>` : '';
  }).join('')}</div>`;
}
function itemReal(it) {
  const ops = it.opciones && it.opciones.length ? `<br><small class="muted">${esc(it.opciones.join(' / '))}</small>` : '';
  return `<li><span class="fmt">${esc(it.formato)}${it.abierta ? ' · abierta' : ''}</span>${esc(it.consigna)}${it.enunciado ? `<br><span class="fr">${esc(it.enunciado)}</span>` : ''}${ops}${it.respuesta ? ` <span class="resp">→ ${esc(it.respuesta)}</span>` : ''}</li>`;
}
function ejerciciosReales(ej) {
  return `<div class="ej">${ETAPAS.map(([k, label]) => (ej[k] || []).length ? `<div class="ej-grupo"><h4>${label} · ${ej[k].length}</h4><ol>${ej[k].map(itemReal).join('')}</ol></div>` : '').join('')}</div>`;
}

function claseHTML(c) {
  const num = c.id.split('.c')[1], r = rev[docId('clase-' + c.id)] || {};
  return `<details class="clase" data-id="${esc(c.id)}"><summary><span class="k">${esc(num)}</span>
    <span class="t"><strong>${esc(c.titulo)}</strong><small>${esc(c.objetivo)}</small></span>
    <span class="row">${r.nota ? '<span class="chip cambios">Nota</span>' : ''}${c.estado === 'publicado' ? '<span class="chip pub">Publicada</span>' : '<span class="chip plan">Planificada</span>'}</span></summary>
    <div class="ficha"><div class="grid2">
      <div class="field"><h4>Gramática</h4><ul>${c.gramatica.map(g => `<li>${esc(g)}</li>`).join('')}</ul></div>
      <div class="field"><h4>Vocabulario · ${esc(c.campo)}</h4><p>${listaPalabras(c)}</p></div>
      <div class="field"><h4>Situación</h4><p>${esc(c.situacion)}</p>${c.sonido ? `<h4 style="margin-top:8px">Sonido del día</h4><p class="fr">${esc(c.sonido)}</p>` : ''}</div>
      <div class="field"><h4>Tarea de evaluación</h4><p>${esc(c.tarea)}</p></div>
      <div class="field"><h4>Introduce · repasa</h4><div class="keys">${c.introduce.map(k => `<span class="key new">${esc(k)}</span>`).join('')}${c.recicla.map(k => `<span class="key">${esc(k)}</span>`).join('')}</div></div>
    </div>
    ${c.contenido ? '' : planEjercicios(c.ejercicios)}
    ${contenido(c)}
    <div class="note"><label class="field" for="nota-${docId(c.id)}"><h4>Tu nota para esta clase</h4></label>
      <textarea id="nota-${docId(c.id)}" placeholder="Qué cambiarías: tema, ejemplo, palabra, nivel de dificultad…">${esc(r.nota || '')}</textarea>
      <div class="row"><button class="btn" data-guardar="${esc(c.id)}" ${db ? '' : 'disabled'}>Guardar nota</button>${r.fecha ? `<small class="muted">Guardada el ${esc(fecha(r.fecha))}</small>` : ''}</div></div>
    </div></details>`;
}

function renderNivel(n) {
  const r = rev[docId('nivel-n' + n.nivel)] || {};
  const q = filtro.trim().toLowerCase();
  const pasa = c => !q || [c.titulo, c.objetivo, c.tarea, c.campo, ...c.gramatica, ...c.palabras, ...c.introduce, JSON.stringify(c.ejercicios || '')].join(' ').toLowerCase().includes(q);
  const bloques = n.bloques.map(b => {
    const cs = n.clases.filter(c => c.bloque === b.bloque && pasa(c));
    if (!cs.length) return '';
    return `<section><div class="block-head"><span class="n">BLOQUE ${b.bloque}${b.tipo === 'integracion' ? ' · INTEGRACIÓN' : ''}</span><h3>${esc(b.tema)}</h3>
      <small class="muted">${esc(b.objetivo)} · Situaciones: ${esc(b.situaciones.join(', '))}</small></div>${cs.map(claseHTML).join('')}</section>`;
  }).join('') || '<p class="muted">Ninguna clase coincide con la búsqueda.</p>';
  return `<section class="panel"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">Nivel ${n.nivel} · ${esc(n.cefr)} · ${esc(n.examen)}</div><h2>${esc(n.titulo)}</h2></div>${chipRevision(r)}</div>
      <p style="margin:0">${esc(n.objetivo)}</p>${n.nota ? `<p class="muted" style="margin:0">${esc(n.nota)}</p>` : ''}
      <p class="muted" style="margin:0">${publicadas(n)} de ${n.clases.length} clases publicadas.</p></section>
    <section class="panel review"><h3>Tu revisión del nivel ${n.nivel}</h3>
      <label for="nota-nivel"><span class="muted">Comentario general (opcional): qué falta, qué sobra, qué cambiarías.</span></label>
      <textarea id="nota-nivel">${esc(r.nota || '')}</textarea>
      <div class="row"><button class="btn primary" data-nivel="aprobado" ${db ? '' : 'disabled'}>Aprobar nivel ${n.nivel}</button>
        <button class="btn warn" data-nivel="cambios" ${db ? '' : 'disabled'}>Pedir cambios</button>
        ${db ? '' : '<small class="muted">Para guardar tu revisión, abre la página con tu sesión iniciada.</small>'}</div></section>
    <input class="search" id="buscar" type="search" placeholder="Buscar en el nivel: tema, gramática, palabra…" value="${esc(filtro)}">
    <div id="bloques" style="display:grid;gap:22px">${bloques}</div>`;
}

function renderPersonajes() {
  const hechos2 = (DATA.niveles.find(n => n.nivel === 2) || {}).hechos || [];
  return `<section class="panel"><h2>Personajes</h2><p class="muted" style="margin:0">El mismo reparto acompaña al alumno de un nivel a otro. Cada revisión de bloque confirma estos hechos para que la historia no se contradiga.</p>
    <div class="cards">${DATA.personajes.map(p => `<div class="card"><h3>${esc(p.nombre)}</h3><small class="muted">${esc([p.edad ? p.edad + ' años' : '', p.nacionalidad, p.ciudad].filter(Boolean).join(' · '))}</small>
      <p style="margin:6px 0 0">${esc(p.ocupacion)}</p><small class="muted">${esc(p.familia)}</small></div>`).join('')}</div></section>
    <section class="panel"><h3>Hechos de la historia · Nivel 1</h3><ul>${DATA.hechosN1.map(h => `<li>${esc(h)}</li>`).join('')}</ul></section>
    <section class="panel"><h3>Hechos de la historia · Nivel 2</h3><ul>${hechos2.map(h => `<li>${esc(h)}</li>`).join('')}</ul></section>`;
}

function render() {
  renderStats(); renderTabs();
  const n = DATA.niveles.find(x => 'n' + x.nivel === tab);
  $('#main').innerHTML = tab === 'personajes' ? renderPersonajes() : n ? renderNivel(n) : renderResumen();
}

function abiertas() { return [...document.querySelectorAll('details.clase[open]')].map(d => d.dataset.id); }
function rerender() {
  const open = abiertas(), y = scrollY, foco = document.activeElement && document.activeElement.id;
  const borradores = {}; document.querySelectorAll('textarea').forEach(t => borradores[t.id] = t.value);
  render();
  open.forEach(id => { const d = document.querySelector(`details.clase[data-id="${CSS.escape(id)}"]`); if (d) d.open = true; });
  Object.entries(borradores).forEach(([id, v]) => { const t = document.getElementById(id); if (t && document.activeElement !== t) t.value = v; });
  if (foco && document.getElementById(foco)) document.getElementById(foco).focus();
  scrollTo(0, y);
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab]');
  if (t) { tab = t.dataset.tab; filtro = ''; try { localStorage.setItem('plan-tab', tab); } catch (_) {} render(); scrollTo(0, 0); return; }
  const nb = e.target.closest('[data-nivel]');
  if (nb && db) {
    const n = tab.slice(1), nota = $('#nota-nivel').value.trim();
    nb.disabled = true;
    try { await db.collection('revision').doc(docId('nivel-n' + n)).set({tipo: 'nivel', nivel: Number(n), estado: nb.dataset.nivel, nota, por: userId, fecha: new Date().toISOString()});
      toast(nb.dataset.nivel === 'aprobado' ? `Nivel ${n} aprobado` : `Cambios pedidos para el nivel ${n}`); }
    catch (err) { toast('No se pudo guardar: ' + (err && err.message || 'inténtalo otra vez')); }
    nb.disabled = false; return;
  }
  const g = e.target.closest('[data-guardar]');
  if (g && db) {
    const id = g.dataset.guardar, nota = document.getElementById('nota-' + docId(id)).value.trim();
    g.disabled = true;
    try { const ref = db.collection('revision').doc(docId('clase-' + id));
      if (nota) await ref.set({tipo: 'clase', clase: id, nota, por: userId, fecha: new Date().toISOString()}); else await ref.delete();
      toast(nota ? 'Nota guardada' : 'Nota borrada'); }
    catch (err) { toast('No se pudo guardar: ' + (err && err.message || 'inténtalo otra vez')); }
    g.disabled = false;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'buscar') { filtro = e.target.value; const n = DATA.niveles.find(x => 'n' + x.nivel === tab);
    const tmp = document.createElement('div'); tmp.innerHTML = renderNivel(n); $('#bloques').replaceWith(tmp.querySelector('#bloques')); }
});

render();
(async () => {
  if (!window.claude || !claude.use) return;
  try {
    const [d, u] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (u) { try { userId = await u.id(); } catch (_) {} }
    if (!d) return;
    db = d; rerender();
    db.collection('revision').onSnapshot(snap => { rev = {}; snap.docs.forEach(x => { if (x.exists) rev[x.id] = x.data() || {}; }); rerender(); });
  } catch (_) {}
})();
</script>
