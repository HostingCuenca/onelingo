name: onelingo
description: "OneLingo · aprendizaje de idiomas con IA. 10 niveles × 100 lecciones por idioma, práctica libre con 50 situaciones."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.1
  shared_preferences: ^2.5.5
  google_fonts: ^6.2.1
  intl: ^0.20.3
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  http: ^1.6.0
  google_sign_in: ^7.2.0
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  crypto: ^3.0.7
  record: ^7.1.1
  http_parser: ^4.1.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/
    - assets/img/
    - assets/img/home-icons/
    - assets/img/educacion/en/
    - assets/img/mascotas/
    - assets/img/flags/
    - assets/img/situaciones/
    - assets/img/fotos/
    - assets/img/tutores/
    - assets/img/emoji/
    - assets/sfx/
    - assets/contenido/en/
    - assets/contenido/es/
    - assets/contenido/fr/
    - assets/contenido/de/
    - assets/contenido/pt/
    - assets/contenido/it/
    - assets/contenido/zh/
    - assets/contenido/ja/
    - assets/contenido/ko/
    - assets/contenido/ru/
    - assets/contenido/en/ruta/
    - assets/contenido/en/nivel0/
    - assets/contenido/fr/nivel0/
    - assets/contenido/es/nivel0/
    - assets/contenido/pt/nivel0/
    - assets/contenido/de/nivel0/
    - assets/contenido/es/ruta/
    - assets/contenido/fr/ruta/
    - assets/contenido/de/ruta/
    - assets/contenido/pt/ruta/
    - assets/contenido/it/ruta/
    - assets/contenido/zh/ruta/
    - assets/contenido/ja/ruta/
    - assets/contenido/ko/ruta/
    - assets/contenido/ru/ruta/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
